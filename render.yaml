# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cleancrawl
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENABLE_BROWSER
        value: "false"
      - key: MAX_CRAWL_SEEDS
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cleancrawl-db
          property: connectionString

databases:
  - name: cleancrawl-db
    plan: free
    databaseName: cleancrawl
    user: cleancrawl
