services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cleancrawl
      POSTGRES_PASSWORD: cleancrawl
      POSTGRES_DB: cleancrawl
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleancrawl -d cleancrawl"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_BROWSER: "false"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://cleancrawl:cleancrawl@db:5432/cleancrawl
      PORT: "8000"
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      ENABLE_BROWSER: "false"
      MAX_CRAWL_SEEDS: "30"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
